# Tobi configuration. Allow-lists and limits live here, and only here.

model:
  # "nvidia" = NVIDIA-hosted Nemotron through the OpenAI-compatible API (key in .env as NVIDIA_API_KEY).
  # "ollama" = the local model below. Prompts sent to the cloud are redacted of passwords, tokens and keys,
  # but they do contain the request text and the tool results (system data) - use "ollama" for data that
  # must stay on this machine.
  provider: nvidia
  nvidia:
    base_url: https://integrate.api.nvidia.com/v1
    name: nvidia/nemotron-3-ultra-550b-a55b          # strongest; about 4 s per call
    fallback_name: nvidia/nemotron-3.5-super-vl-120b-a12b   # tried if the first is busy or errors
    # moonshotai/kimi-k3.1-pro also works with this key: put it in `name` to use Kimi instead.
    api_key_env: NVIDIA_API_KEY
    max_tokens: 4096          # reasoning models spend part of this on thinking
    temperature: 0
    fallback_to_ollama: true  # use the local model below if the cloud cannot be reached
    extra_body: {}            # extra request fields, for example {reasoning_effort: low}
  # --- local Ollama model (used when provider is "ollama", or as the fallback) ---
  # PRD target is qwen3:8b (fallback qwen3:4b). This VM has qwen2.5:7b pulled and
  # too little free disk for qwen3:8b, so it is the default until disk is freed.
  name: qwen2.5:7b
  base_url: http://localhost:11434
  temperature: 0
  num_ctx: 4096
  # Set to false for qwen3 models to turn off their thinking output.
  # Leave as null for models that do not support the setting.
  reasoning: null
  request_timeout_seconds: 180

limits:
  max_tool_calls_per_request: 10
  tool_timeout_seconds: 30
  max_tool_output_chars: 1500
  malformed_output_retries: 2

paths:
  audit_db: data/audit.db
  checkpoint_db: data/checkpoints.db

performance:
  # Never closed, whatever the model asks. Compared case-insensitively.
  protected_processes:
    - system
    - system idle process
    - registry
    - smss.exe
    - csrss.exe
    - wininit.exe
    - winlogon.exe
    - services.exe
    - lsass.exe
    - lsaiso.exe
    - svchost.exe
    - fontdrvhost.exe
    - dwm.exe
    - explorer.exe
    - sihost.exe
    - ctfmon.exe
    - taskhostw.exe
    - runtimebroker.exe
    - searchhost.exe
    - startmenuexperiencehost.exe
    - shellexperiencehost.exe
    - textinputhost.exe
    - securityhealthservice.exe
    - msmpeng.exe
    - nissrv.exe
    - memory compression
    - spoolsv.exe
    - audiodg.exe
    - conhost.exe
    - ollama.exe
    - ollama app.exe
    - ollama_llama_server.exe
    - llama-server.exe
    - memcompression
    - python.exe
    - pythonw.exe
    - streamlit.exe
    - vmmem
    - vmmemws

storage:
  # Only files inside these folders can be deleted. Environment variables are expanded.
  allowed_temp_folders:
    - "%TEMP%"
    - "C:\\Windows\\Temp"
  # Files modified more recently than this are left alone (they may be in use).
  min_file_age_minutes: 60
  # The only cache folders clear_app_cache may empty.
  app_caches:
    edge: '%LOCALAPPDATA%\Microsoft\Edge\User Data\Default\Cache'
    chrome: '%LOCALAPPDATA%\Google\Chrome\User Data\Default\Cache'
    teams: '%LOCALAPPDATA%\Packages\MSTeams_8wekyb3d8bbwe\LocalCache\Microsoft\MSTeams\EBWebView\Default\Cache'

network:
  public_ping_host: 1.1.1.1
  test_hostnames:
    - www.microsoft.com
    - www.google.com
    - www.wikipedia.org
  test_website: https://www.microsoft.com

desktop:
  # name -> executable. Only these apps can be opened.
  # A value ending in ":" is a Windows URI (opened with the shell); anything else is an executable name that is
  # looked up on PATH and in the Windows "App Paths" registry. Add your own apps here.
  allowed_apps:
    notepad: notepad.exe
    calculator: calc.exe
    paint: mspaint.exe
    explorer: explorer.exe
    chrome: chrome.exe
    edge: msedge.exe
    firefox: firefox.exe
    word: winword.exe
    excel: excel.exe
    powerpoint: powerpnt.exe
    outlook: outlook.exe
    onenote: onenote.exe
    teams: ms-teams.exe
    vscode: code.exe
    vs code: code.exe
    visual studio code: code.exe
    snipping tool: snippingtool.exe
    task manager: taskmgr.exe
    control panel: control.exe
    camera: "microsoft.windows.camera:"
    zoom: zoom.exe
    notepad++: notepad++.exe
    7-zip: 7zFM.exe
  # Browsers open_website can use (name -> executable). "default" always works and uses the Windows default.
  search_url: https://www.google.com/search?q={q}
  browsers:
    chrome: chrome.exe
    edge: msedge.exe
    firefox: firefox.exe
  # Friendly names the user may say instead of an address.
  website_aliases:
    youtube: https://www.youtube.com
    google: https://www.google.com
    gmail: https://mail.google.com
    outlook web: https://outlook.office.com
    office: https://www.office.com
    github: https://github.com
    linkedin: https://www.linkedin.com
    wikipedia: https://www.wikipedia.org
    stackoverflow: https://stackoverflow.com
    chatgpt: https://chatgpt.com
    claude: https://claude.ai
    teams web: https://teams.microsoft.com
    sharepoint: https://www.office.com/launch/sharepoint
  # Window titles (regex, case-insensitive) the agent may interact with.
  # Windows Tobi may look into and operate (list_controls, click_control, type_text, press_keys).
  allowed_windows:
    - "notepad"
    - "save as"
    - "calculator"
    - "snipping tool"
    - "paint"
    - "save print output"
  # Only used if pasting fails and the text has to be typed key by key.
  type_delay_seconds: 0.03

# Organisation: ODCs (offices / delivery centres) and how to recognise them. Used to pick the SOPs that apply.
# SAMPLE values: replace with your organisation's ODCs, subnets and computer-name prefixes.
organisation:
  odc_override: ""              # force one ODC for this PC (kiosks, testing); empty = detect
  seats_file: "organisation/seats.csv"   # computer (or remote PC) name -> ODC, floor, seat
  # Each ODC: how to recognise it (subnets, floors, computer-name prefixes, security groups) and ITS rules for
  # printers, Wi-Fi and VPN. In a virtual desktop (AVD) the user's own PC is the one that sits in the office, so
  # when Windows does not tell Tobi where that PC is, Tobi asks the user once and remembers the answer.
  odcs:
    HYD-ODC-2:
      name: "Hyderabad ODC 2"
      subnets: ["10.42.16.0/20"]
      floors: { "3": ["10.42.17.0/24"], "5": ["10.42.19.0/24"] }
      hostname_prefixes: ["HYD2-"]
      groups: ["HYD2-All-Staff"]
      printing_sop: "SOP-IT-PRN-004 v3.1"
      network_sop: "SOP-IT-NET-002 v2.0"
      printers:
        - { name: "HYD2-F3-Mono-01", queue: "\\\\printsrv-hyd\\HYD2-F3-Mono-01", floor: "3", location: "3rd floor, near the pantry",
            colour: false, accepts: [pdf, docx, xlsx, pptx, txt, png, jpg], max_pages: 100, secure_release: true }
        - { name: "HYD2-F3-Colour-02", queue: "\\\\printsrv-hyd\\HYD2-F3-Colour-02", floor: "3", location: "3rd floor, print room",
            colour: true, accepts: [pdf, docx, xlsx, pptx, png, jpg], max_pages: 30, secure_release: true,
            allowed_groups: ["HYD2-Colour-Print"], approval: "Colour is for client deliverables and marketing material only" }
        - { name: "HYD2-F5-Mono-03", queue: "\\\\printsrv-hyd\\HYD2-F5-Mono-03", floor: "5", location: "5th floor, east wing",
            colour: false, accepts: [pdf, docx, xlsx, pptx, txt, png, jpg], max_pages: 100, secure_release: true }
      wifi:
        corporate: ["HYD2-Corp"]
        guest: ["HYD2-Guest"]
        notes: "Company laptops use HYD2-Corp (certificate sign-in). Personal phones may use HYD2-Guest only."
      vpn:
        client: "GlobalProtect"
        gateway: "vpn-hyd.example.com"
        when_needed: "Not needed in the office. Always connect the VPN when working from home or outside the ODC."
    PUNE-ODC-1:
      name: "Pune ODC 1"
      subnets: ["10.51.0.0/20"]
      floors: { "0": ["10.51.1.0/24"] }
      hostname_prefixes: ["PUN1-"]
      groups: ["PUN1-All-Staff"]
      printing_sop: "SOP-IT-PRN-005 v1.4"
      network_sop: "SOP-IT-NET-003 v1.0"
      printers:
        - { name: "PUN1-G-SecurePrint-01", queue: "\\\\printsrv-pun\\PUN1-G-SecurePrint-01", floor: "0", location: "Ground floor, security desk",
            colour: false, accepts: [pdf], max_pages: 25, secure_release: true,
            approval: "Every print job needs your project manager's approval (ServiceNow request)" }
      wifi:
        corporate: ["PUN1-Secure"]
        guest: []
        notes: "Pune ODC 1 has no guest Wi-Fi. Client network rules apply: only company devices on PUN1-Secure."
      vpn:
        client: "GlobalProtect"
        gateway: "vpn-pun.example.com"
        when_needed: "Not needed in the ODC. Work from home needs the client-approved VPN profile and manager approval."

automation:
  max_record_seconds: 30        # longest screen recording Tobi will make
  record_fps: 15

browser:
  # Use the Edge already installed on Windows, so no Chromium download is needed.
  # Set to null to use Playwright's bundled Chromium (run: playwright install chromium).
  channel: msedge
  headless: false
  # The test portal is served locally from ./test_portal on this port.
  test_portal_port: 8765
  download_folder: "%USERPROFILE%\\Downloads"
  allowed_tasks:
    download_latest_report: "Open the test portal and download the latest report"

# ---- added for the extended capability set -------------------------------------------------

safety:
  # true = the agent may only read. Every change is blocked (global kill switch).
  read_only_mode: false

software:
  # Approved software catalogue. An entry with a winget_id can be installed by Tobi after the user approves
  # (winget, silent, exact id). Entries without one are requested through a ticket. `aliases` are other names users say; `match` is the text to look
  # for in the installed-programs list to confirm the install worked.
  approved_catalog:
    - {name: "Google Chrome", aliases: [chrome], winget_id: "Google.Chrome", match: "Google Chrome", how_to_get: "Standard on all laptops"}
    - {name: "Mozilla Firefox", aliases: [firefox], winget_id: "Mozilla.Firefox", match: "Firefox", how_to_get: "No approval needed"}
    - {name: "Zoom", winget_id: "Zoom.Zoom", match: "Zoom", how_to_get: "No approval needed"}
    - {name: "Microsoft Teams", aliases: [teams], winget_id: "Microsoft.Teams", match: "Teams", how_to_get: "Standard on all laptops"}
    - {name: "7-Zip", aliases: [7zip, 7 zip], winget_id: "7zip.7zip", match: "7-Zip", how_to_get: "No approval needed"}
    - {name: "Visual Studio Code", aliases: [vscode, vs code], winget_id: "Microsoft.VisualStudioCode", match: "Visual Studio Code", how_to_get: "Developers only"}
    - {name: "Notepad++", aliases: [notepad plus plus], winget_id: "Notepad++.Notepad++", match: "Notepad++", how_to_get: "No approval needed"}
    - {name: "VLC", aliases: [vlc media player], winget_id: "VideoLAN.VLC", match: "VLC", how_to_get: "No approval needed"}
    - {name: "Adobe Acrobat Pro", how_to_get: "Software request ticket; needs manager approval (paid licence)"}

security:
  # Domains treated as genuine by check_suspicious_link.
  trusted_domains: [microsoft.com, office.com, live.com, google.com, apple.com, amazon.com, paypal.com,
                    linkedin.com, dropbox.com, docusign.com, adobe.com, okta.com, netflix.com, dhl.com, fedex.com]

# ---- Connectors: what Tobi can reach beyond the built-in diagnostics ----------------------------------
# enabled: true/false switches a connector on. Credentials are never stored here: they go in the .env file.
# A connector that is enabled but missing its credentials shows "needs setup" in the interface and its tools
# are not offered to the agent. Every change a connector can make still needs the user's approval (R1/R2).
connectors:
  files:
    enabled: true
    # The ONLY folders the Files tools may touch (environment variables are expanded).
    folders:
      - '%USERPROFILE%\Documents'
      - '%USERPROFILE%\Desktop'
      - '%USERPROFILE%\Downloads'
    max_read_kb: 200
  shell:
    enabled: true            # PowerShell: each command needs approval and passes a deny-list
  web:
    enabled: true            # read public web pages and search
  directory:
    enabled: true            # opens the official self-service password reset page (the agent never resets it itself)
    sspr_url: https://aka.ms/sspr
  microsoft365:
    enabled: true            # needs M365_CLIENT_ID in .env (see "Setup" in the interface)
    scopes: [Mail.ReadWrite, Mail.Send, Calendars.ReadWrite]
  intune:
    enabled: false           # needs the same Entra app plus admin-consented Intune permissions
    scopes: [DeviceManagementManagedDevices.Read.All, DeviceManagementManagedDevices.PrivilegedOperations.All]
  defender:
    enabled: false
    scopes: [SecurityAlert.Read.All]
  servicenow:
    enabled: false           # needs SERVICENOW_INSTANCE, SERVICENOW_USER, SERVICENOW_PASSWORD in .env

# Live view: the interface shows a docked panel with screenshots of what the agent just did (a browser opening, a
# folder, a file written ...). Screenshots stay on this computer (data/live) and are never sent to the model.
live_view:
  enabled: true

# Autopilot: the general agent that chains tools across all connectors (plan, act, check, repeat).
autopilot:
  max_steps: 8               # model decisions per request
  history_chars: 700         # how much of each earlier tool result the model is shown

# ---- RAG (Retrieval-Augmented Generation) subsystem -------------------------
# Run scripts/init_rag.py once to create the index from kb/*.md
rag:
  # Hybrid retrieval settings (§5 / §13 of the RAG spec)
  top_k_candidates: 50          # BM25 + dense candidates before rerank
  top_k_final: 6                # results returned to the agent
  rrf_k: 60                     # RRF fusion constant
  freshness_decay_days: 180     # exponential decay half-life for freshness score
  max_context_tokens: 2000      # token budget for context block sent to LLM
  sufficiency_threshold: 0.25   # relevance (0-1, share of query terms covered) below which retrieval is "irrelevant"; >=0.6 is "sufficient"
  max_fallback_retries: 2       # corrective-RAG retry attempts (§5.5)

  # Embedding model (optional – leave default for CPU-only setups)
  # Requires: pip install sentence-transformers
  # Set to null to disable dense search (BM25-only mode)
  embedding_model: "all-MiniLM-L6-v2"   # used only when embedding_provider is "local"
  # Vector search: "nvidia" = NVIDIA hosted embeddings (same NVIDIA_API_KEY as the chat model, nothing to install),
  # "local" = sentence-transformers on this PC, "none" = keyword search only.
  embedding_provider: nvidia
  # Tried in order; a model NVIDIA has withdrawn is skipped automatically (vectors are re-made for the new one).
  nvidia_embedding_models: ["nvidia/nemotron-3.5-embed-1b", "nvidia/nemotron-3-embed-1b"]
  vendor_trust: 0.8                     # imported Microsoft Learn articles rank a little below the company KB
  # When the knowledge base has nothing relevant, answer from the model's general knowledge (clearly labelled)
  general_knowledge_fallback: true

  # Ingestion settings (§3)
  chunk_max_words: 600          # split long sections at this word count
  chunk_min_tokens: 30          # drop chunks shorter than this
  pii_masking: true             # mask emails, phone numbers, IPs on ingest

  # Freshness / lifecycle (§8)
  # doc_type -> review cycle in days (after which freshness score degrades)
  review_cycles:
    runbook: 180
    kb: 180
    policy: 365
    ticket: 90
    vendor: 365
    error_code: 90

  # Trust order (§5.3) – higher is more trusted for ranking boosts
  doc_type_trust:
    error_code: 1.0
    runbook: 0.95
    kb: 0.9
    policy: 0.85
    ticket: 0.7
    faq: 0.65
    vendor: 0.6

  # ACL groups that have access to restricted KB content (§7)
  # Leave empty ([]) to allow all content to all users (single-tenant prototype)
  default_user_groups: []

  # Knowledge gap queue – notify when gap count exceeds this
  gap_alert_threshold: 10

  # Learning loop: auto-draft KB after this many similar resolved tickets (§11)
  draft_kb_min_similar_tickets: 3
